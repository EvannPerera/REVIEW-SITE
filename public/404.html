<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ÉVANN_STORIES — Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages Single Page App Redirect
      // Converts path to query/hash parameter so index.html loads the correct page
      var segmentCount = 1; // 1 for repo root (/REVIEW-SITE/)
      var location = window.location;
      
      // Compute path relative to repo base
      var pathSegments = location.pathname.split('/').filter(Boolean);
      var route = '';
      if (pathSegments.length > 1) {
        // e.g. /REVIEW-SITE/reviews -> #/reviews
        route = '#/' + pathSegments.slice(1).join('/');
      }
      
      var target = location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        '/' + (pathSegments[0] || '') + '/' + route + location.search;
        
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to ÉVANN_STORIES...</p>
  </body>
</html>
